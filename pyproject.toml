[project]
name = "sid-intent-rec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=2.2",
    "rich>=13.0",
    "tqdm>=4.66",
    "torch>=2.14.0",
    "click>=8.1",
    "wandb>=0.30.0",
    "pyyaml>=6.0",
    "transformers>=5.17.0",
    "click>=8.5.0",
]

[project.scripts]
recommender = "pipeline.cli:recommender"
quantizer = "pipeline.cli:quantizer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
